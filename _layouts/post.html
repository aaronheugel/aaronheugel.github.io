---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav" aria-label="Post navigation">
    <div class="post-nav-links">
      {% if page.previous %}
        <a class="post-nav-prev" href="{{ page.previous.url | relative_url }}">
          <span class="post-nav-label">&larr; Previous</span>
          <span class="post-nav-title">{{ page.previous.title }}</span>
        </a>
      {% endif %}
      {% if page.next %}
        <a class="post-nav-next" href="{{ page.next.url | relative_url }}">
          <span class="post-nav-label">Next &rarr;</span>
          <span class="post-nav-title">{{ page.next.title }}</span>
        </a>
      {% endif %}
    </div>
    <p class="post-nav-back"><a href="{{ '/writing/' | relative_url }}">&larr; All writing</a></p>
  </nav>
</article>
