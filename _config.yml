title: Aaron Dow
description: Essays, poetry, and writing by Aaron Dow
author: Aaron Dow
url: "https://aarondow.com"
baseurl: ""
lang: en

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - LICENSE
