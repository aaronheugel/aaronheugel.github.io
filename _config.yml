title: Aaron Dow
description: Essays, poetry, and writing by Aaron Dow
author: Aaron Dow
url: "https://aarondow.com"
baseurl: ""
lang: en

markdown: kramdown

collections:
  writing:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: "writing"
    values:
      layout: "piece"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
